name: Update LeetWar Stats

on:
  schedule:
    # Робот будет запускаться автоматически каждую ночь в 00:00 по Гринвичу
    - cron: '0 0 * * *'
  workflow_dispatch: # Позволяет запускать обновление вручную в любое время

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Устанавливаем библиотеку для работы с интернет-запросами
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # Запускаем наш калькулятор опыта (XP)
      - name: Run XP calculator
        run: python update_stats.py

      # Сохраняем обновленный README.md обратно в ваш репозиторий
      - name: Commit and Push changes
        run: |
          git config --global user.name "LeetWarBot"
          git config --global user.email "bot@leetwar.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "⚔️ Робот обновил таблицу PvP и XP" && git push)
