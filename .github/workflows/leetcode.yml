name: Update LeetWar Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ШАГ 1: Принудительно скачиваем файлы вашего репозитория (включая update_stats.py)
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ШАГ 2: Разворачиваем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ШАГ 3: Устанавливаем библиотеку запросов к LeetCode API
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ШАГ 4: Переходим в рабочую папку и запускаем наш калькулятор опыта
      - name: Run XP calculator
        run: |
          echo "Текущая папка: $(pwd)"
          echo "Список файлов:"
          ls -la
          python update_stats.py

      # ШАГ 5: Записываем обновленные данные в README.md
      - name: Commit and Push changes
        run: |
          git config --global user.name "LeetWarBot"
          git config --global user.email "bot@leetwar.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "⚔️ Робот обновил таблицу PvP и XP" && git push)
